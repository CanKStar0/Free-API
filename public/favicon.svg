<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%" fill="none">
  <defs>
    <!-- Gradients -->
    <linearGradient id="topPlateGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185" stop-opacity="0.95" />
      <stop offset="40%" stop-color="#e11d48" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#be123c" stop-opacity="0.85" />
    </linearGradient>

    <linearGradient id="midPlateGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e11d48" stop-opacity="0.85" />
      <stop offset="50%" stop-color="#be123c" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#9e0a2b" stop-opacity="0.75" />
    </linearGradient>

    <linearGradient id="botPlateGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#be123c" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#9e0a2b" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#4c0519" stop-opacity="0.95" />
    </linearGradient>

    <linearGradient id="edgeGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="50%" stop-color="#ffe4e6" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#fda4af" stop-opacity="0.6" />
    </linearGradient>

    <linearGradient id="circuitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#fecdd3" stop-opacity="0.75" />
    </linearGradient>

    <!-- Filters -->
    <filter id="plateShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000000" flood-opacity="0.45" />
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#be123c" flood-opacity="0.35" />
    </filter>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#ffffff" flood-opacity="0.8" />
    </filter>
  </defs>

  <g transform="translate(0, 10)">
    <!-- BOTTOM LAYER -->
    <!-- 3D Extrusion Side Panels -->
    <path d="M76 340 L76 368 L256 458 L256 430 Z" fill="#4c0519" opacity="0.95" />
    <path d="M436 340 L436 368 L256 458 L256 430 Z" fill="#330310" opacity="0.95" />
    <!-- Bottom Top Surface -->
    <polygon points="256,250 436,340 256,430 76,340" fill="url(#botPlateGrad)" filter="url(#plateShadow)" />
    <!-- Bottom Edge Glow -->
    <polygon points="256,250 436,340 256,430 76,340" fill="none" stroke="url(#edgeGlow)" stroke-width="4" stroke-linejoin="round" opacity="0.65" />
    <path d="M76 340 L76 368 L256 458 L436 368 L436 340" fill="none" stroke="url(#edgeGlow)" stroke-width="3.5" stroke-linejoin="round" opacity="0.5" />

    <!-- MIDDLE LAYER -->
    <!-- 3D Extrusion Side Panels -->
    <path d="M76 225 L76 247 L256 337 L256 315 Z" fill="#881337" opacity="0.9" />
    <path d="M436 225 L436 247 L256 337 L256 315 Z" fill="#5b0a1f" opacity="0.9" />
    <!-- Middle Top Surface -->
    <polygon points="256,135 436,225 256,315 76,225" fill="url(#midPlateGrad)" filter="url(#plateShadow)" />
    <!-- Middle Edge Glow -->
    <polygon points="256,135 436,225 256,315 76,225" fill="none" stroke="url(#edgeGlow)" stroke-width="5" stroke-linejoin="round" opacity="0.8" />
    <path d="M76 225 L76 247 L256 337 L436 247 L436 225" fill="none" stroke="url(#edgeGlow)" stroke-width="4" stroke-linejoin="round" opacity="0.6" />
    
    <!-- Middle Data Paths -->
    <path d="M166 225 L216 250 L216 275" fill="none" stroke="url(#circuitGrad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.75" />
    <circle cx="216" cy="275" r="6" fill="#ffffff" filter="url(#neonGlow)" />
    <path d="M346 225 L296 250 L296 275" fill="none" stroke="url(#circuitGrad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.75" />
    <circle cx="296" cy="275" r="6" fill="#ffffff" filter="url(#neonGlow)" />

    <!-- TOP LAYER -->
    <!-- 3D Extrusion Side Panels -->
    <path d="M76 110 L76 130 L256 220 L256 200 Z" fill="#9e0a2b" opacity="0.95" />
    <path d="M436 110 L436 130 L256 220 L256 200 Z" fill="#75061e" opacity="0.95" />
    <!-- Top Surface -->
    <polygon points="256,20 436,110 256,200 76,110" fill="url(#topPlateGrad)" filter="url(#plateShadow)" />
    <!-- Top Edge Highlight (Razor Sharp White/Pink Neon) -->
    <polygon points="256,20 436,110 256,200 76,110" fill="none" stroke="url(#edgeGlow)" stroke-width="6" stroke-linejoin="round" />
    <path d="M76 110 L76 130 L256 220 L436 130 L436 110" fill="none" stroke="url(#edgeGlow)" stroke-width="4.5" stroke-linejoin="round" opacity="0.8" />

    <!-- Top Plate Circuit Nodes & API Data Streams -->
    <g filter="url(#neonGlow)">
      <!-- Left to Center Circuit -->
      <path d="M150 110 L195 132 L230 115 L230 92" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
      <circle cx="150" cy="110" r="7" fill="#ffffff" />
      <circle cx="230" cy="92" r="7" fill="#ffffff" />

      <!-- Right to Center Circuit -->
      <path d="M362 110 L317 132 L282 115 L282 92" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
      <circle cx="362" cy="110" r="7" fill="#ffffff" />
      <circle cx="282" cy="92" r="7" fill="#ffffff" />

      <!-- Center Data Core Node -->
      <circle cx="256" cy="110" r="14" fill="#ffffff" />
      <circle cx="256" cy="110" r="7" fill="#be123c" />
    </g>
  </g>
</svg>
