<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#be123c" />
      <stop offset="45%" stop-color="#9e0a2b" />
      <stop offset="100%" stop-color="#4c0519" />
    </linearGradient>
    
    <!-- Top Layer Glow Gradient -->
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- Center Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#ffe4e6" />
    </linearGradient>

    <!-- Shadow filter for 3D depth -->
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.4" />
    </filter>
    <filter id="layerGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Squircle Base Container -->
  <rect x="24" y="24" width="464" height="464" rx="124" ry="124" fill="url(#bgGrad)" filter="url(#dropShadow)" />
  
  <!-- Subtle Inner Border Highlight -->
  <rect x="25" y="25" width="462" height="462" rx="123" ry="123" fill="none" stroke="rgba(255, 255, 255, 0.22)" stroke-width="4" />
  
  <!-- Subtle Top Sheen Overlay -->
  <path d="M 24 148 C 24 79 79 24 148 24 L 364 24 C 433 24 488 79 488 148 L 488 240 C 350 210 160 210 24 240 Z" fill="url(#glowGrad)" />

  <!-- Central API Layer Icon Group -->
  <g filter="url(#layerGlow)" transform="translate(0, 10)">
    <!-- Bottom Layer (Depth) -->
    <path d="M120 326 L256 392 L392 326 L360 308 L256 358 L152 308 Z" fill="#ffffff" fill-opacity="0.38" />
    
    <!-- Middle Layer -->
    <path d="M120 252 L256 318 L392 252 L360 234 L256 284 L152 234 Z" fill="#ffffff" fill-opacity="0.7" />
    
    <!-- Top Main Plate -->
    <polygon points="256,120 392,184 256,248 120,184" fill="url(#accentGrad)" />
    
    <!-- Center Core Connection Node (API Data Pulse) -->
    <circle cx="256" cy="184" r="24" fill="#be123c" />
    <circle cx="256" cy="184" r="13" fill="#ffffff" />
    
    <!-- Code Brackets < > on Top Plate -->
    <path d="M198 175 L180 184 L198 193" fill="none" stroke="#9e0a2b" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M314 175 L332 184 L314 193" fill="none" stroke="#9e0a2b" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
